[package]
name = "architalk"
version = "0.2.3"
edition = "2024"
rust-version = "1.85"
description = "A local, conversational software architecture partner"
license = "MIT"
repository = "https://github.com/ryujt/ArchiTalk"

[dependencies]
anyhow = "1"
async-stream = "0.3"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
hex = "0.4"
libc = "0.2"
open = "5"
rusqlite = { version = "0.38", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
which = "8"

[dev-dependencies]
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
strip = true
