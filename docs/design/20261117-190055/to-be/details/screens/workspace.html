    @media(max-width:760px){.preview-bar{padding:7px 14px;align-items:flex-start;font-size:10px;gap:7px;flex-direction:column}.preview-controls{width:100%;justify-content:space-between}.preview-controls select{max-width:170px;font-size:10px}.preview-note{font-size:10px;line-height:1.6}.app-header{height:66px;padding:0 17px}.brand{font-size:18px}.brand-mark{width:28px;height:30px;font-size:20px}.project-crumb{display:none}.connection{display:none}.header-right{gap:3px}.mobile-info{display:block;font-size:11px;padding:8px}.app-body{display:block;min-height:calc(100vh - 133px)}.workspace{padding:24px 20px}.workspace-top{margin-bottom:22px;padding-bottom:17px}.workspace-top h2{font-size:15px}.aux-panel{display:none;border-left:0;border-top:1px solid var(--line);padding:24px 24px 30px}.show-info .aux-panel{display:block}.welcome{padding-top:12px}.welcome h1{font-size:28px}.welcome-emblem{margin-bottom:22px}.starter-card{padding:19px;margin-top:25px}.starter-footer{align-items:flex-end}.starter-footer span{max-width:125px;line-height:1.7}.primary,.secondary,.danger-button{min-height:40px;padding:11px 14px;font-size:11px}.guidance-row{gap:10px}.guidance-card{padding:14px 12px}.guidance-card p{font-size:10px}.chat-turn{gap:9px}.chat-message p{font-size:12px;word-break:normal}.chat-thread{gap:20px}.avatar{flex-basis:25px;width:25px;height:25px}.status-card{padding:23px 20px}.status-card h1{font-size:22px}.status-card .button-row{align-items:stretch;flex-direction:column}.document-paper{padding:22px 19px}.review-actions{align-items:stretch;flex-direction:column}.review-actions .primary{width:100%}.composer-help{font-size:9px}.workspace-footer{margin-top:23px}.dialog-header{padding:22px 20px 17px}.dialog-body{padding:20px}.dialog-header h2{font-size:19px}.dialog-footer{align-items:stretch}.dialog-footer .button-row{width:100%}.dialog-footer .button-row>*{flex:1}.compare-columns{grid-template-columns:1fr}.phase-pill{font-size:9px}.document-path{font-size:11px}}
    @media(max-width:480px){.field-grid{grid-template-columns:1fr}.role-setting .field-grid{grid-template-columns:1fr}.dialog-footer .button-row{flex-wrap:wrap}.dialog-footer .button-row>*{flex-basis:100%}}
    @media(prefers-reduced-motion:no-preference){.workspace-content{animation:enter .18s ease-out}@keyframes enter{from{opacity:.55;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}}

</head>
<body>
  <aside class="preview-bar" aria-label="검토용 제어 영역">
    <div class="preview-note"><span class="dot" aria-hidden="true"></span><span><strong>설계 검토용 모형</strong> · 예시 대화이며 파일·설정·외부 연결을 변경하지 않습니다.</span></div>
    <div class="preview-controls"><label for="scene-select">장면</label><select id="scene-select"></select><a href="../../navigation.md">시나리오 문서 ↗</a></div>
  </aside>
  <div id="app-shell">
    <header class="app-header">
      <div class="header-left"><a class="brand" href="#welcome" aria-label="ArchiTalk 시작 장면"><span class="brand-mark" aria-hidden="true">A</span>ArchiTalk</a><div class="project-crumb"><span>현재 프로젝트</span><span aria-hidden="true">/</span><b>notify-service</b></div></div>
      <div class="header-right"><span class="connection"><span class="connection-dot"></span>이 컴퓨터에 연결됨</span><button class="quiet-button mobile-info" type="button" data-action="toggle-info" aria-expanded="false" aria-controls="aux-panel">설계 메모</button><button class="quiet-button" type="button" data-action="open-settings">⚙ <span>연결 설정</span></button></div>
    </header>
    <div class="app-body">
      <nav class="sidebar" aria-label="설계 대화의 진행">
        <div><p class="sidebar-title">WORKSPACE</p><p class="project-title">회원 알림 서비스</p><span class="local-label">⌂ 현재 프로젝트 안에서 작업</span><div class="session-item"><span class="session-icon" aria-hidden="true">▤</span><div>새로운 서비스 설계<div class="session-sub">오늘 · 이 컴퓨터의 대화</div></div></div></div>
        <div><p class="sidebar-title">함께 정리할 내용</p><div class="steps" id="steps"></div></div>
        <div class="sidebar-bottom"><p>생각이 아직 정리되지 않았어도<br>괜찮아요. 대화하며 좁혀 가요.</p><div class="local-pill"><i aria-hidden="true"></i>대화는 자동으로 기록됩니다</div></div>
      </nav>
      <main class="workspace" id="main-content" tabindex="-1"><div class="workspace-top" id="workspace-top"></div><div class="workspace-content" id="workspace-content"></div><footer class="workspace-footer">ArchiTalk가 제안한 가정과 결정은 저장 전에 함께 확인해 주세요.</footer></main>
      <aside class="aux-panel" id="aux-panel" aria-label="설계 메모와 문서"><div class="aux-tabs" role="tablist" aria-label="보조 정보"><button class="aux-tab active" type="button" role="tab" aria-selected="true" aria-controls="notes-panel" id="notes-tab" data-panel="notes">설계 메모</button><button class="aux-tab" type="button" role="tab" aria-selected="false" aria-controls="documents-panel" id="documents-tab" data-panel="documents" tabindex="-1">문서</button></div><div id="notes-panel" role="tabpanel" aria-labelledby="notes-tab"></div><div id="documents-panel" role="tabpanel" aria-labelledby="documents-tab" hidden></div></aside>
    </div>
  </div>
  <dialog id="scene-dialog" aria-labelledby="dialog-title"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div id="live-status" class="sr-only" role="status" aria-live="polite"></div>
  <script>
    'use strict';
    const sceneNames={welcome:'시작 · 프로젝트 소개',interview:'인터뷰 · 한 질문씩',validation:'답변 입력 오류','review-validation':'수정 요청 입력 오류',generating:'초안 정리 중',paused:'초안 정리 중지',review:'초안 검토',approved:'검토본 확정','save-preview':'문서 반영 전 확인',saved:'문서 저장 완료',conflict:'같은 이름의 문서 충돌','external-change':'외부에서 바뀐 문서',error:'답변 연결 실패',recovery:'이전 대화 이어가기',settings:'연결 설정','settings-error':'연결 설정 실패','save-error':'문서 저장 실패'};
    const modalScenes=new Set(['settings','settings-error','save-preview','conflict','external-change']);
    const basePath='docs/architecture/회원-알림-서비스/아키텍처-설계.md';
    const copyPath='docs/architecture/회원-알림-서비스-개정-2/아키텍처-설계.md';
    const state={scene:'welcome',panel:'notes',answer:'',extraAnswers:[],settingsReturn:'interview',modalReturn:'review',path:basePath,autoComplete:false,timer:null,toastTimer:null,hasDraft:false,projectIntro:'회원에게 이메일과 앱 알림을 보내는 서비스를 만들고 싶어요.',externalReviewed:false,cli:'claude',capabilityChecked:false,generationDue:null,approved:false,revision:1,draftRevision:null,scale:null,firstFeature:null,smallStart:false,draftFacts:null,exportNumber:0,lastSavedPath:null};
    const content=document.getElementById('workspace-content');
    const dialog=document.getElementById('scene-dialog');
    const sceneSelect=document.getElementById('scene-select');
    const esc=value=>String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    sceneSelect.innerHTML=Object.entries(sceneNames).map(([id,label])=>`<option value="${id}">${label}</option>`).join('');
    function go(scene){if(!sceneNames[scene])scene='welcome';if(location.hash.slice(1)===scene){render(scene)}else{location.hash=scene}}
    function notify(message){const toast=document.getElementById('toast');clearTimeout(state.toastTimer);toast.textContent=message;toast.hidden=false;state.toastTimer=setTimeout(()=>toast.hidden=true,3500)}
    function turn(who,body,time='지금'){const user=who==='user';return `<div class="chat-turn ${user?'user':''}"><span class="avatar ${user?'user':''}" aria-hidden="true">${user?'나':'A'}</span><div class="chat-message"><div class="sender">${user?'나':'ArchiTalk'}<span class="time">${time}</span></div>${body}</div></div>`}
    function assistant(body,time='지금'){return turn('assistant',body,time)}
    function user(body,time='지금'){return turn('user',body,time)}
    function composer(placeholder='편하게 답해 주세요. 아직 모르겠다면 그렇게 말해도 좋아요.',error=false){return `<form class="composer" id="answer-form" novalidate><label class="sr-only" for="answer-input">ArchiTalk에 답변</label>${error?'<p class="validation-text" id="answer-error" role="alert">답변을 적거나 아래의 ‘아직 정하지 않았어요’를 선택해 주세요.</p>':''}<textarea id="answer-input" rows="2" placeholder="${esc(placeholder)}" ${error?'aria-invalid="true" aria-describedby="answer-error"':''}>${esc(state.answer)}</textarea><div class="composer-bottom"><span>Enter로 전송 · Shift + Enter로 줄바꿈</span><button class="send-button" type="submit" aria-label="답변 보내기">↑</button></div></form><div class="composer-help"><span>대화는 이 컴퓨터에 자동으로 기록돼요.</span><button type="button" data-action="generate">현재 답변으로 초안 만들기 ↗</button></div>`}
    function welcome(){return `<section class="welcome"><div class="welcome-emblem" aria-hidden="true">✳</div><p class="eyebrow" style="margin-bottom:12px">A little conversation, a clearer design</p><h1>어떤 서비스를<br>만들고 싶으세요?</h1><p class="intro">생각을 편하게 들려주세요. 규모와 중요한 조건을 하나씩 짚고, 지금 필요한 깊이의 설계로 함께 정리할게요.</p><form class="starter-card" id="start-form"><label for="project-intro">만들고 싶은 것부터 한두 문장으로</label><textarea class="starter-input" id="project-intro" rows="3" placeholder="예: 회원에게 이메일과 앱 알림을 보내는 작은 서비스를 만들고 싶어요.">회원에게 이메일과 앱 알림을 보내는 서비스를 만들고 싶어요.</textarea><div class="starter-footer"><span>구체적인 기술을 정하지 않아도 괜찮아요.</span><button class="primary" type="submit">대화 시작 <span aria-hidden="true">↗</span></button></div></form><div class="guidance-row"><div class="guidance-card"><span aria-hidden="true">◎</span><h3>한 번에 하나씩</h3><p>왜 묻는지 설명하고,<br>답변에 맞춰 다음 질문을 골라요.</p></div><div class="guidance-card"><span aria-hidden="true">▤</span><h3>필요한 만큼의 설계</h3><p>작은 시작에는 간결하게,<br>복잡한 조건은 빠짐없이 살펴봐요.</p></div></div><div class="privacy-note"><span aria-hidden="true">⌁</span><span>프로젝트 파일은 바꾸지 않아요. 대화에 사용할 정보는 오른쪽에서 확인할 수 있어요.</span></div></section>`}
    function interview(validation=false){const extra=state.extraAnswers.map((answer,index)=>user(`<p>${esc(answer)}</p>`,index?'조금 전':'14:32')).join('');const next=state.extraAnswers.length?`<p>${state.scale?`예상 회원 수는 <b>${esc(state.scale)}</b>로 기록했어요.`:'예상 회원 수는 <b>아직 미정</b>으로 남겨둘게요. 확인되지 않은 수치를 가정으로 채우지 않을게요.'}</p><p class="question-heading">가장 먼저 완성해야 하는 알림은 어떤 것인가요?</p><p>가입 안내, 결제 결과, 예약 알림처럼 한 가지를 골라도 좋고, 아직 모르면 함께 비교해 볼 수 있어요.</p>`:`<p>이메일과 앱 알림을 함께 다루는 서비스군요. 먼저 필요한 크기부터 가늠해 볼게요.</p><p class="question-heading">처음 서비스를 이용할 회원은 어느 정도로 예상하시나요?</p><p>정확한 수치가 없어도 괜찮아요. 대략적인 범위나 ‘아직 모름’으로 답해 주세요.</p>`;return `<div class="chat-thread">${assistant('<p>반가워요. 어떤 서비스를 만들고 싶은지, 지금 떠오르는 모습을 들려주세요.</p>','14:30')}${user(`<p>${esc(state.projectIntro)}</p>`,'14:31')}${extra}${assistant(`${next}<div class="question-why">왜 묻나요? · 이용 규모를 알면 처음부터 필요한 구조와, 나중에 더해도 되는 부분을 구분할 수 있어요.</div><div class="quick-answers"><button class="quick-answer" type="button" data-answer="처음에는 회원 약 2천 명 정도예요.">처음에는 약 2천 명</button><button class="quick-answer" type="button" data-answer="아직 정하지 않았어요. 작게 시작하고 싶어요.">아직 정하지 않았어요</button><button class="quick-answer" type="button" data-answer="가입 안내 알림부터 작게 만들고 싶어요.">가입 안내부터 시작</button></div>`)}</div><p class="checkpoint"><span aria-hidden="true">✓</span> ${state.extraAnswers.length?'방금 답변까지 대화에 기록했어요':'현재 대화까지 기록했어요'} · 기록 ${state.revision}</p>${composer(undefined,validation)}`}
    function generating(){return `${assistant('<p>지금까지 나눈 이야기를 바탕으로 첫 설계를 정리하고 있어요.</p><p>아직 정하지 않은 내용은 가정으로 구분해서, 함께 검토할 수 있도록 남길게요.</p>')}<section class="status-card"><div class="status-icon" aria-hidden="true">✳</div><h1>작게 시작할 수 있는<br>설계를 정리하고 있어요</h1><p>필요한 내용을 빠뜨리지 않고, 지금 규모에 맞는 선택을 담고 있어요.</p><div class="progress-list"><div class="progress-item complete"><span class="progress-dot">✓</span>확인된 요구와 가정 구분</div><div class="progress-item complete"><span class="progress-dot">✓</span>주요 책임과 데이터 흐름 정리</div><div class="progress-item current"><span class="progress-dot" aria-hidden="true"></span>실패 상황과 다음 결정 살펴보기</div></div><div class="button-row"><button class="secondary" type="button" data-go="paused">정리 중지</button></div><p class="progress-foot">정리를 중지해도 이미 나눈 대화는 남아 있어요. 문서는 아직 바뀌지 않아요.</p></section>`}
    function paused(){return `<section class="status-card"><div class="status-icon warn" aria-hidden="true">Ⅱ</div><h1>초안 정리를 멈췄어요</h1><p>확인된 대화와 기존 초안은 그대로 있어요. 더 이야기한 뒤 다시 정리하거나, 같은 내용으로 새로 시도할 수 있어요.</p><div class="button-row"><button class="primary" type="button" data-go="interview">대화로 돌아가기</button><button class="secondary" type="button" data-action="generate">다시 정리하기</button></div><p class="progress-foot">중지한 답변은 완성된 초안에 섞지 않아요. 저장된 문서도 바뀌지 않았어요.</p></section>`}
    function documentPreview(){const facts=state.draftFacts||state;const stale=state.draftRevision!==state.revision;return `<article class="document-preview"><div class="document-toolbar"><span><span aria-hidden="true">▤</span>아키텍처-설계.md</span><span>${state.approved?'검토본 · 이 버전 확정':stale?'이전 대화 기준 초안':'초안 · 검토 준비됨'}</span></div><div class="document-paper"><p class="doc-label">ARCHITECTURE · 기록 ${state.draftRevision} 기준 ${stale?'· 새 답변 반영 필요':'· 현재 대화와 일치'}</p><h2>회원 알림 서비스<br>아키텍처 설계</h2><p>회원에게 이메일과 앱 알림을 전달한다. ${facts.scale?`예상 이용 규모는 사용자 진술 기준 ${esc(facts.scale)}이다.`:'예상 이용 규모는 아직 미정이다.'} 아래 구조는 확인 전 설계 제안이며, 실패한 발송을 다시 시도할 방법을 검토한다.</p><h3>01 · 확인된 범위와 제안</h3><ul class="doc-list"><li>사용자 진술: ${esc(facts.projectIntro)}</li><li>${facts.firstFeature?'사용자 진술: 가입 안내 알림부터 시작':'미정: 처음 제공할 알림 종류'}</li><li>설계 제안: 채널별 결과 기록과 중복 발송 방지</li></ul><h3>02 · 제안하는 책임과 흐름</h3><div class="architecture-row" aria-label="회원 서비스에서 알림 서비스로, 이어 이메일과 앱 채널로 전달"><span class="architecture-box">회원 서비스</span><span class="architecture-arrow" aria-hidden="true">→</span><span class="architecture-box">알림 서비스</span><span class="architecture-arrow" aria-hidden="true">→</span><span class="architecture-box">이메일 · 앱</span></div><h3>03 · 아직 확인할 내용</h3><p>${facts.externalReviewed?'기존 문서에서 확인한 보관 기간 30일은 참고 근거로 남겼다. 이번 초안에도 유지할지는 사용자 확인이 필요하다.':'발송 결과 보관 기간은 아직 미정이다.'} 앱 알림 도착 허용 시간도 확인해야 한다. 이 초안 저장은 이러한 가정의 수락을 뜻하지 않는다.</p></div></article>`}
    function review(validation=false){return `<div class="chat-thread">${assistant('<p>첫 설계를 정리했어요. <b>지금 필요한 부분과 아직 결정하지 않은 부분</b>을 나눠 두었어요.</p><p>아래 초안을 살펴보세요. 다른 방향이 좋다면 대화로 수정할 수 있어요.</p>')}</div>${documentPreview()}<details class="inline-notice" open><summary style="cursor:pointer;font-weight:650">${state.draftRevision!==state.revision?'이전 초안의 검토 메모 · 다시 검토 필요':'검토 메모 · 막는 지적 없음'}</summary><p style="margin-top:8px">중복 발송 방지 원칙은 이번 설계에 반영했어요. 알림 도착 시간과 보관 기간은 미정으로 남겼고, 후속 결정에서 확인해요.</p><div class="button-row" style="margin-top:12px"><button class="secondary" type="button" data-action="approve" ${state.approved||state.draftRevision!==state.revision?'disabled':''}>${state.approved?'이 버전의 검토본 확정됨':state.draftRevision!==state.revision?'새 답변 반영 후 확정 가능':'이 버전을 검토본으로 확정'}</button></div></details><div class="review-actions"><p class="review-note">${state.approved?'내용을 확정했지만 아직 파일에는 반영하지 않았어요.':'검토본 확정 전에도 초안으로 저장할 수 있어요.'}<br>저장할 파일과 변경 내용을 한 번 더 확인해요.</p><button class="primary" type="button" data-go="save-preview">문서에 반영 <span aria-hidden="true">↗</span></button></div>${composer('예: 발송 실패를 운영자가 확인하는 방법도 추가해 주세요.',validation)}`}
    function saved(){return `<section class="status-card"><div class="status-icon" aria-hidden="true">✓</div><p class="eyebrow" style="margin-bottom:9px">Saved to your project</p><h1>설계 문서를 저장했어요</h1><p>프로젝트 안에서 바로 읽고 수정할 수 있어요. 대화를 이어가면 변경할 내용을 다시 확인한 뒤 문서에 반영할 수 있어요.</p><div class="saved-path"><span>이번에 저장한 문서 · 1개 · ${state.approved?'검토본':'초안'}</span><strong>${esc(state.path)}</strong></div><div class="button-row"><button class="primary" type="button" data-go="review">문서 살펴보기</button><button class="secondary" type="button" data-go="interview">대화 이어가기</button></div><p class="progress-foot">이번 설계는 한 문서로 충분해요. 요구가 복잡해지면 필요한 문서만 더 제안할게요.</p></section>`}
    function error(){return `<section class="status-card"><div class="status-icon error" aria-hidden="true">!</div><h1>답변을 이어받지 못했어요</h1><p>대화는 마지막으로 확인된 답변까지 남아 있어요. 연결을 확인한 뒤 다시 시도하거나, 지금까지의 내용을 살펴볼 수 있어요.</p><div class="error-detail">응답을 기다리던 중 연결이 끊어졌어요. 마지막 답변은 완성되지 않아 초안에 반영하지 않았어요.</div><div class="button-row"><button class="primary" type="button" data-action="generate">다시 시도</button><button class="secondary" type="button" data-action="open-settings">연결 설정 확인</button><button class="quiet-button" type="button" data-go="interview">대화로 돌아가기</button></div><p class="progress-foot">문서는 바뀌지 않았어요. 다시 시도하면 마지막 요청부터 새 답변을 만들어요.</p></section>`}
    function recovery(){return `<section class="status-card"><div class="status-icon" aria-hidden="true">↶</div><p class="eyebrow" style="margin-bottom:10px">Welcome back</p><h1>이어서 이야기할까요?</h1><p>이 프로젝트에서 나누던 대화를 찾았어요. 마지막으로 확인된 지점부터 이어갈 수 있어요.</p><div class="recovery-details"><div><span>대화 주제</span><strong>회원 알림 서비스</strong></div><div><span>마지막 기록</span><strong>오늘 14:32 · 요구 정리</strong></div><div><span>문서 상태</span><strong>초안 있음 · 저장 전</strong></div></div><div class="button-row"><button class="primary" type="button" data-action="resume">이어서 대화하기</button><button class="secondary" type="button" data-go="review">초안 먼저 살펴보기</button><button class="quiet-button" type="button" data-go="welcome">새 대화 시작</button></div><p class="progress-foot">중단된 답변을 자동으로 다시 요청하지 않아요. 새 대화를 시작해도 이전 기록은 남아 있어요.</p></section>`}
    function saveError(){return `<section class="status-card"><div class="status-icon error" aria-hidden="true">!</div><h1>문서를 저장하지 못했어요</h1><p>초안과 대화는 남아 있어요. 저장할 폴더의 쓰기 권한과 남은 공간을 확인한 뒤 다시 반영해 주세요.</p><div class="saved-path"><span>저장하려던 문서</span><strong>${esc(state.path)}</strong></div><div class="error-detail">문서를 새로 쓰는 중 문제가 생겼어요. 기존 문서는 유지됐고, 이번 변경은 저장되지 않았어요.</div><div class="button-row"><button class="primary" type="button" data-go="save-preview">다시 저장 준비</button><button class="secondary" type="button" data-go="review">초안 검토로 돌아가기</button></div></section>`}
    function modalHeader(eyebrow,title){return `<div class="dialog-header"><div><p class="eyebrow">${eyebrow}</p><h2 id="dialog-title">${title}</h2></div><button class="dialog-close" type="button" data-action="close-modal" aria-label="닫고 이전 장면으로 돌아가기">×</button></div>`}
    function savePreview(){const ready=state.hasDraft&&state.draftRevision===state.revision;return `${modalHeader('Review before saving','이 내용으로 문서를 저장할까요?')}<div class="dialog-body"><p>저장할 위치와 변경할 내용을 확인해 주세요. 이름은 지금 바꿀 수 있어요. 기존 문서는 바꾸지 않고 새 파일로 저장해요.</p><form id="save-form" novalidate><div class="form-field"><label for="output-path">문서 위치 · 현재 프로젝트 기준</label><input id="output-path" value="${esc(state.path)}" aria-describedby="output-help output-error"><small id="output-help">이미 파일이 있으면 새 사본 이름을 다시 제안해요.</small><small id="output-error" class="validation-text" role="alert" hidden></small></div><div class="diff"><div class="diff-header"><span>아키텍처 설계 · ${state.externalReviewed?'새 사본':'새 문서'}</span><span>기록 ${state.draftRevision} 기준</span></div>${state.externalReviewed?'<div class="diff-line neutral">참고 근거 · 기존 문서의 보관 기간 30일</div><div class="diff-line add">＋ 이번 대화에서 정리한 요구와 제안</div><div class="diff-line add">＋ 아직 확인하지 않은 조건을 분리</div>':'<div class="diff-line add">＋ 서비스 목적과 처음 제공할 범위</div><div class="diff-line add">＋ 알림 전달 흐름과 중복 방지 제안</div><div class="diff-line add">＋ 미정인 조건과 후속 결정</div>'}</div><div class="inline-notice"><b>내용 상태: ${state.approved?'검토본 · 현재 버전 확정':ready?'초안 · 검토 준비됨':'초안 · 이전 대화 기준'}</b><br>저장 성공과 내용 확정은 달라요. 초안으로 저장하면 가정과 미정을 그대로 남겨요.</div><div class="dialog-footer"><button class="quiet-button" type="button" data-go="review">검토로 돌아가기</button><div class="button-row"><button class="${ready&&!state.approved?'secondary':'primary'}" type="submit" name="save-kind" value="draft">${state.approved?'검토본으로 저장':'초안으로 저장'}</button>${ready&&!state.approved?'<button class="primary" type="submit" name="save-kind" value="approve">검토본으로 확정하고 저장</button>':''}</div></div></form></div>`}
    function conflict(){const copy=copyPath;return `${modalHeader('Choose a safe name','같은 이름의 문서가 있어요')}<div class="dialog-body"><p>확인하는 사이에 같은 위치에 문서가 생겼어요. 기존 문서를 보존하도록 새 사본으로 저장하는 방법을 권해요.</p><div class="saved-path"><span>이미 있는 문서</span><strong>${esc(basePath)}</strong></div><div class="saved-path"><span>제안하는 새 사본</span><strong>${esc(copy)}</strong></div><div class="warning-box">기존 문서는 그대로 남아요. 비교한 내용을 새 개정 폴더의 문서로 저장해요.</div><div class="dialog-footer"><button class="quiet-button" type="button" data-go="save-preview">이름 다시 정하기</button><div class="button-row"><button class="secondary" type="button" data-go="external-change">기존 문서와 비교</button><button class="primary" type="button" data-action="save-copy">새 사본으로 저장</button></div></div></div>`}
    function externalChange(){return `${modalHeader('Review the latest document','다른 곳에서 바뀐 문서가 있어요')}<div class="dialog-body"><p>미리 본 뒤에 프로젝트의 문서 내용이 달라졌어요. 최신 내용을 먼저 확인하고, 새 사본에서 참고할 내용을 검토해 주세요.</p><p class="small path-break">${esc(basePath)}</p><div class="compare-columns"><div class="compare-card"><h3>지금 프로젝트의 문서</h3><p>발송 결과는 <b>30일 동안 보관</b>한다.<br>운영자가 실패 내역을 확인한다.</p></div><div class="compare-card"><h3>이번에 정리한 초안</h3><p>발송 결과의 <b>보관 기간은 미정</b>이다.<br>실패한 요청은 다시 시도한다.</p></div></div><div class="warning-box">기존 파일은 바꾸지 않아요. 저장하면 새 개정 폴더에 사본을 만들어요.</div><div class="dialog-footer"><button class="quiet-button" type="button" data-go="review">나중에 결정</button><div class="button-row"><button class="secondary" type="button" data-action="prepare-copy">새 사본 준비</button><button class="primary" type="button" data-action="reload-document">비교를 참고해 다시 검토</button></div></div></div>`}
    function effortOptions(inherit=false){return `<option value="default">${inherit?'기본 설정 따름':'CLI 기본값'}</option><option value="low" ${state.capabilityChecked?'':'disabled'}>low</option><option value="medium" ${state.capabilityChecked?'':'disabled'}>medium</option><option value="high" ${state.capabilityChecked?'':'disabled'}>high</option>`}
    function roleSettings(role,label){return `<div class="role-setting"><label>${label}</label><div class="field-grid"><div class="form-field"><label for="${role}-backend">사용할 도구</label><select id="${role}-backend" name="${role}Backend" data-role-cli="${role}"><option value="default">기본 도구 따름</option><option value="claude">Claude Code</option><option value="codex">Codex</option></select></div><div class="form-field"><label for="${role}-model">모델 재정의 · 선택</label><input id="${role}-model" name="${role}Model" list="model-suggestions" placeholder="기본 모델 따름"></div><div class="form-field"><label for="${role}-effort">생각 수준 재정의</label><select id="${role}-effort" name="${role}Effort">${effortOptions(true)}</select></div></div></div>`}
    function settings(failed=false){return `${modalHeader('Your local AI tools','답변에 사용할 도구')}<div class="dialog-body"><p>로컬에 설치된 Claude 또는 Codex를 사용해요. 모델 처리는 선택한 CLI의 설정에 따르며, 해당 도구의 기존 로그인을 그대로 사용해요.</p>${failed?'<div class="warning-box" role="alert"><b>도구를 실행할 준비가 되지 않았어요.</b><br>실행 파일의 설치 위치와 로그인 상태를 실행한 터미널에서 확인해 주세요. 수정한 뒤 진단하고, 원래 작업에서 다시 시도할 수 있어요.</div>':''}<form id="settings-form"><div class="field-grid"><div class="form-field"><label for="cli-kind">사용할 도구</label><select id="cli-kind" name="cli"><option value="claude" ${state.cli==='claude'?'selected':''}>Claude Code</option><option value="codex" ${state.cli==='codex'?'selected':''}>Codex</option></select></div><div class="form-field"><label for="cli-path">실행 파일 이름 또는 경로</label><input id="cli-path" name="executable" value="${state.cli}" readonly aria-describedby="executable-help"><small id="executable-help">사용자 전역 설정에 준비된 경로예요. 실행 위치 변경은 터미널의 사용자 설정에서 해 주세요.</small></div></div><div class="form-field" id="codex-profile-field" ${state.cli==='codex'?'':'hidden'}><label for="codex-profile">Codex profile · 선택</label><input id="codex-profile" name="profile" placeholder="기존 기본 profile 사용"><small>Codex에 준비한 profile이 있을 때만 지정해요.</small></div><div class="diagnostics" id="cli-diagnostics"><div class="diagnostic">설치<b>${failed?'확인 필요':'진단 전'}</b></div><div class="diagnostic">버전<b>${failed?'확인 필요':'진단 전'}</b></div><div class="diagnostic">로그인<b>${failed?'로그인 필요':'요청 전 미확인'}</b></div></div><button class="secondary" type="button" data-action="test-connection">설치·버전 진단</button><div class="settings-section"><h3>모든 역할의 기본 설정</h3><p>비워 두면 선택한 CLI의 기본 모델과 생각 수준을 사용해요.</p><div class="field-grid"><div class="form-field"><label for="default-model">모델 · 선택 또는 직접 입력</label><input id="default-model" name="model" list="model-suggestions" placeholder="CLI 기본 모델 사용"><datalist id="model-suggestions"></datalist><small id="model-suggestion-help">확인된 추천값이 없으면 모델 이름을 직접 입력할 수 있어요.</small></div><div class="form-field"><label for="default-effort">생각 수준</label><select id="default-effort" name="effort">${effortOptions()}</select><small id="effort-help">${state.cli==='claude'?'Claude effort':'Codex reasoning effort'} · 지원하는 값만 선택해요.</small></div></div><div class="capability-note" id="capability-note">지원 미확인 · 설치 버전의 옵션과 모델별 호환성은 따로 확인해요. 무료 진단은 로그인이나 모델 응답을 시험하지 않아요.</div></div><details class="settings-section" open><summary style="font-size:12px;font-weight:650;cursor:pointer">역할마다 다르게 설정하기 · 선택</summary>${roleSettings('conversation','대화')}${roleSettings('draft','설계 작성')}${roleSettings('critique','비판 검토')}</details><div class="connection-notice" style="margin-top:20px">설정 변경은 <b>다음 생성부터</b> 적용돼요. 지금 진행 중인 작업은 시작할 때의 설정으로 마무리해요. ArchiTalk는 인증 정보를 별도로 보관하지 않아요.</div><div class="dialog-footer"><button class="quiet-button" type="button" data-action="close-modal">취소</button><button class="primary" type="submit">다음 작업부터 적용</button></div></form></div>`}
    function renderAux(baseScene){const beginning=baseScene==='welcome';const notes=document.getElementById('notes-panel');notes.innerHTML=beginning?`<div class="panel-heading"><h3>대화에 사용할 정보</h3><span class="mini-label">전달 범위</span></div><p class="context-intro">질문을 준비하는 데 필요한 정보만 먼저 확인했어요.</p><div class="file-row"><span class="file-symbol" aria-hidden="true">▧</span><div><b>프로젝트 폴더 이름</b><small>notify-service · 이름만 사용</small></div></div><div class="file-row"><span class="file-symbol" aria-hidden="true">▤</span><div><b>README.md</b><small>제목과 소개 3줄 · 내용 미리보기</small></div></div><div class="file-row"><span class="file-symbol" aria-hidden="true">◇</span><div><b>프로젝트 구성</b><small>구성 파일의 종류만 확인</small></div></div><details class="scope-details" open><summary>전달할 내용 미리보기</summary><p>프로젝트: notify-service<br>소개: 회원에게 이메일과 앱 알림을 전달하는 서비스.<br>구성: 프로젝트 설명 문서가 있음.</p><p>대화를 시작하면 위 요약과 직접 적은 소개를 선택한 도구로 보내요. 전체 파일, 숨김 파일, 인증 정보는 보내지 않아요.</p></details>`:`<div class="panel-heading"><h3>대화에서 확인한 사실</h3><span class="mini-label">사용자 진술</span></div><p class="context-intro">직접 말한 내용과 아직 정하지 않은 내용,<br>설계 제안을 나누어 두었어요.</p><div class="fact-card"><div class="fact-title">만들고 싶은 서비스</div><p>${esc(state.projectIntro)}</p><div class="source">사용자 진술 · 기록 1</div></div><div class="fact-card"><div class="fact-title">예상 이용 규모</div><p>${state.scale?esc(state.scale):'미정 · 확인한 수치 없음'}</p><div class="source">${state.scale?'사용자가 직접 적은 범위':'미정은 임의의 수치로 채우지 않아요'}</div></div>${state.firstFeature?'<div class="fact-card"><div class="fact-title">처음 제공할 범위</div><p>가입 안내 알림부터 시작</p><div class="source">사용자 진술</div></div>':''}<div class="fact-card unresolved"><div class="fact-title">설계 제안 · 확인 전</div><p>하나의 서비스로 시작하는 안과<br>발송 실패 재시도 방법을 검토</p><span class="tag">제안</span><span class="tag">사용자 확정 아님</span></div><div class="fact-card unresolved"><div class="fact-title">아직 정하지 않았어요</div><p>${state.scale?'':'초기 이용 규모<br>'}알림 도착 허용 시간<br>발송 결과 보관 기간</p></div><details class="scope-details"><summary>참고한 프로젝트 정보</summary><p>폴더 이름과 README 소개를 참고했어요. 전체 소스 파일은 읽거나 전달하지 않았어요.</p></details>`;const draftState=!state.hasDraft?'미생성':state.draftRevision===state.revision?'현재 대화 기준':'이전 대화 기준 · 다시 정리 필요';document.getElementById('documents-panel').innerHTML=`<div class="panel-heading"><h3>설계 문서</h3><span class="mini-label">${draftState}</span></div><p class="context-intro">처음에는 한 문서로 충분해요.<br>필요해지면 문서를 더 제안할게요.</p><button class="document-item" type="button" data-action="open-document" ${beginning?'disabled':''}><span class="document-icon" aria-hidden="true">▤</span><span><b>${state.hasDraft?'아키텍처 설계':'아직 정리한 초안이 없어요'}</b><small>${state.hasDraft?`기록 ${state.draftRevision} 기준 · 현재 기록 ${state.revision}`:'대화를 나눈 뒤 초안을 만들 수 있어요'}</small></span></button>${!beginning&&!state.hasDraft?'<button class="secondary" type="button" data-action="generate">현재 답변으로 초안 만들기</button>':''}<div class="document-path"><span>${state.hasDraft?'제안한 저장 위치':'문서가 생기면 제안할 위치'}</span>${esc(state.path)}</div>`;document.querySelectorAll('[data-panel]').forEach(tab=>{const selected=tab.dataset.panel===state.panel;tab.classList.toggle('active',selected);tab.setAttribute('aria-selected',String(selected));tab.tabIndex=selected?0:-1});notes.hidden=state.panel!=='notes';document.getElementById('documents-panel').hidden=state.panel!=='documents'}
    function render(scene){if(scene==='save-preview'&&state.exportNumber>0&&state.path===state.lastSavedPath)state.path=`docs/architecture/회원-알림-서비스-개정-${state.exportNumber+1}/아키텍처-설계.md`;if(scene==='saved'&&state.exportNumber===0){state.exportNumber=1;state.lastSavedPath=state.path}if(['review','review-validation','approved','save-preview','saved','conflict','external-change','save-error'].includes(scene)&&!state.hasDraft){state.hasDraft=true;state.draftRevision=state.revision;state.draftFacts={projectIntro:state.projectIntro,scale:state.scale,firstFeature:state.firstFeature,externalReviewed:state.externalReviewed}}if(scene==='approved')state.approved=true;if(scene==='generating')state.approved=false;clearTimeout(state.timer);if(scene==='paused')state.generationDue=null;state.scene=scene;sceneSelect.value=scene;const baseScene=modalScenes.has(scene)?(scene.startsWith('settings')?state.settingsReturn:'review'):scene;state.hasDraft=['review','saved','save-error'].includes(baseScene)||state.hasDraft;const titles={welcome:['처음 시작하기','새로운 서비스의 설계','천천히 시작해요'],interview:['요구를 함께 정리','한 가지씩, 더 분명하게','프로젝트 이해'],validation:['요구를 함께 정리','한 가지씩, 더 분명하게','프로젝트 이해'],generating:['첫 설계를 정리','대화를 설계로 옮기고 있어요','정리 중'],paused:['첫 설계를 정리','초안 정리를 멈췄어요','중지됨'],'review-validation':['설계를 함께 검토','지금 필요한 구조부터 살펴봐요','첫 초안'],approved:['검토본으로 확정','이 버전의 검토를 마쳤어요','확정됨'],review:['설계를 함께 검토','지금 필요한 구조부터 살펴봐요','첫 초안'],saved:['프로젝트에 저장','대화가 문서가 되었어요','저장 완료'],error:['대화를 이어가기','연결을 확인해 주세요','확인 필요'],recovery:['이전 대화','다시 만나 반가워요','이어가기'],'save-error':['문서에 반영','초안은 안전하게 남아 있어요','저장 확인']};const title=titles[baseScene]||titles.interview;document.getElementById('workspace-top').innerHTML=`<div><p class="eyebrow">${title[0]}</p><h2>${title[1]}</h2></div><span class="phase-pill">${title[2]}</span>`;document.title=`${sceneNames[scene]} · ArchiTalk 설계 모형`;const stage=baseScene==='welcome'?0:['interview','validation','error','recovery'].includes(baseScene)?1:2;document.getElementById('steps').innerHTML=[['프로젝트 이해','welcome'],['요구와 중요한 조건','interview'],['설계 검토와 문서화','review']].map(([label,target],index)=>{const locked=index===2&&!state.hasDraft;return `<${locked?'span':'a'} class="step ${index===stage?'active':index<stage?'done':''}" ${locked?'aria-disabled="true"':`href="#${target}"`} ${index===stage?'aria-current="step"':''}><span class="step-number">${index<stage?'✓':`0${index+1}`}</span>${label}</${locked?'span':'a'}>`}).join('');const scenes={welcome,interview:()=>interview(false),validation:()=>interview(true),'review-validation':()=>review(true),generating,paused,review:()=>review(false),approved:()=>review(false),saved,error,recovery,'save-error':saveError};content.innerHTML=(scenes[baseScene]||scenes.interview)();renderAux(baseScene);if(dialog.open){dialog.close()}if(modalScenes.has(scene)){dialog.innerHTML=scene==='settings'?settings(false):scene==='settings-error'?settings(true):scene==='save-preview'?savePreview():scene==='conflict'?conflict():externalChange();dialog.showModal()}document.getElementById('live-status').textContent=`${sceneNames[scene]} 장면`;if(state.autoComplete&&scene==='generating'){state.autoComplete=false;state.generationDue=Date.now()+2200}if(state.generationDue&&baseScene==='generating'){state.timer=setTimeout(()=>{state.generationDue=null;state.hasDraft=true;state.draftRevision=state.revision;state.draftFacts={projectIntro:state.projectIntro,scale:state.scale,firstFeature:state.firstFeature,externalReviewed:state.externalReviewed};if(state.scene==='generating'){go('review')}else if(state.scene.startsWith('settings')&&state.settingsReturn==='generating'){state.settingsReturn='review'}},Math.max(0,state.generationDue-Date.now()))}}
    function submitAnswer(value){const answer=value.trim();if(!answer){state.answer='';go(state.scene==='review'||state.scene==='review-validation'||state.scene==='approved'?'review-validation':'validation');setTimeout(()=>document.getElementById('answer-input')?.focus(),0);return}const firstAnswer=state.extraAnswers.length===0;const scaleMatch=answer.match(/[0-9,]+\s*(?:만|천)?\s*명/);if(firstAnswer||/회원|이용|규모/.test(answer))state.scale=scaleMatch?scaleMatch[0].replace(/\s+/g,' '):null;if(/가입/.test(answer))state.firstFeature='가입 안내';if(/작게/.test(answer))state.smallStart=true;state.extraAnswers.push(answer);state.revision++;state.approved=false;state.answer='';if(state.scene==='review'||state.scene==='review-validation'||state.scene==='approved'){notify('수정 요청을 대화에 남겼어요. 변경한 초안을 다시 정리합니다.');state.autoComplete=true;go('generating')}else{go('interview');notify('답변을 기록했어요. 다음으로 중요한 조건을 확인해 볼게요.')}}
    document.addEventListener('click',event=>{const button=event.target.closest('button,[data-go]');if(!button)return;if(button.dataset.go){go(button.dataset.go);return}if(button.dataset.answer){submitAnswer(button.dataset.answer);return}if(button.dataset.panel){state.panel=button.dataset.panel;renderAux(modalScenes.has(state.scene)?'review':state.scene);return}const action=button.dataset.action;if(action==='approve'){go('approved');notify('이 버전의 내용을 검토본으로 확정했어요. 문서 저장은 별도예요.')}else if(action==='open-document'){if(state.hasDraft){go('review')}else{notify('아직 초안이 없어요. 현재 답변으로 초안 만들기를 선택해 주세요.')}}else if(action==='generate'){state.autoComplete=true;go('generating')}else if(action==='open-settings'){state.settingsReturn=['settings','settings-error'].includes(state.scene)?state.settingsReturn:state.scene;go('settings')}else if(action==='close-modal'){go(state.scene.startsWith('settings')?state.settingsReturn:state.scene==='conflict'?'save-preview':'review')}else if(action==='save-copy'){state.externalReviewed=false;state.path=copyPath;state.exportNumber=Math.max(state.exportNumber+1,2);state.lastSavedPath=state.path;go('saved')}else if(action==='prepare-copy'){state.externalReviewed=false;state.path=copyPath;go('save-preview')}else if(action==='reload-document'){state.externalReviewed=true;state.path=copyPath;state.revision++;state.approved=false;go('review');notify('기존 문서의 내용을 참고 근거로 남겼어요. 저장할 때는 새 사본을 만들어요.')}else if(action==='resume'){go('interview');notify('마지막으로 확인된 대화에서 이어갑니다.')}else if(action==='test-connection'){state.capabilityChecked=true;document.getElementById('cli-diagnostics').innerHTML='<div class="diagnostic">설치<b>확인됨 · 예시</b></div><div class="diagnostic">버전<b>확인됨 · 예시</b></div><div class="diagnostic">로그인<b>요청 전 미확인</b></div>';document.querySelectorAll('#scene-dialog select[id$="effort"] option').forEach(option=>option.disabled=false);document.getElementById('capability-note').textContent='검토용 옵션 프로필 · low / medium / high 후보를 표시했어요. 로그인·선택 모델의 지원은 아직 미확인이며, 실제 실행 전 해당 모델의 호환성 프로필을 확인해요.';document.getElementById('model-suggestions').innerHTML=state.cli==='claude'?'<option value="sonnet">권장 후보 · 호환성 확인 필요</option><option value="opus">권장 후보 · 호환성 확인 필요</option>':'';notify('검토용 진단 예시를 표시했어요. 실제 CLI는 실행하지 않습니다.');}else if(action==='toggle-info'){const expanded=document.body.classList.toggle('show-info');button.setAttribute('aria-expanded',String(expanded));if(expanded)document.getElementById('aux-panel').scrollIntoView({behavior:'auto',block:'start'})}});
    document.addEventListener('submit',event=>{event.preventDefault();if(event.target.id==='start-form'){const intro=document.getElementById('project-intro').value.trim();if(!intro){document.getElementById('project-intro').setCustomValidity('만들고 싶은 서비스를 한두 문장으로 들려주세요.');document.getElementById('project-intro').reportValidity();return}state.projectIntro=intro;state.extraAnswers=[];state.scale=null;state.firstFeature=null;state.smallStart=false;state.hasDraft=false;state.draftRevision=null;state.draftFacts=null;state.approved=false;state.revision=1;state.exportNumber=0;state.lastSavedPath=null;state.path=basePath;go('interview')}else if(event.target.id==='answer-form'){submitAnswer(document.getElementById('answer-input').value)}else if(event.target.id==='save-form'){const path=document.getElementById('output-path').value.trim();if(!path||path.startsWith('/')||path.startsWith('~')||/^[A-Za-z]:/.test(path)||path.split(/[\\/]/).includes('..')||!path.endsWith('.md')){const error=document.getElementById('output-error');error.hidden=false;error.textContent='프로젝트 안의 폴더와 .md 문서 이름을 적어 주세요. 상위 폴더나 절대 경로는 사용할 수 없어요.';document.getElementById('output-path').setAttribute('aria-invalid','true');document.getElementById('output-path').focus();return}if(event.submitter?.value==='approve')state.approved=true;state.path=path;state.exportNumber++;state.lastSavedPath=path;go('saved')}else if(event.target.id==='settings-form'){const customModel=document.getElementById('default-model').value.trim();if(customModel&&!state.capabilityChecked){document.getElementById('capability-note').textContent='지원 미확인 · 모델을 직접 입력했다면 설치·버전 진단부터 확인해 주세요. 진단 성공도 로그인이나 모델 지원을 보장하지 않아요.';document.getElementById('capability-note').setAttribute('role','alert');return}go(state.settingsReturn);notify('예시 도구 설정을 적용했어요. 다음 생성부터 사용합니다.')}});
    document.addEventListener('input',event=>{if(event.target.id==='answer-input')state.answer=event.target.value;if(event.target.id==='project-intro')event.target.setCustomValidity('')});
    document.addEventListener('keydown',event=>{if(event.target.id==='answer-input'&&event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();event.target.form.requestSubmit()}if(event.target.matches('[role="tab"]')&&['ArrowLeft','ArrowRight','Home','End'].includes(event.key)){event.preventDefault();state.panel=state.panel==='notes'?'documents':'notes';if(event.key==='Home')state.panel='notes';if(event.key==='End')state.panel='documents';renderAux(modalScenes.has(state.scene)?'review':state.scene);document.getElementById(`${state.panel}-tab`).focus()}});
    dialog.addEventListener('cancel',event=>{event.preventDefault();go(state.scene.startsWith('settings')?state.settingsReturn:state.scene==='conflict'?'save-preview':'review')});
    sceneSelect.addEventListener('change',()=>{state.autoComplete=false;go(sceneSelect.value)});
    document.addEventListener('change',event=>{if(event.target.dataset.roleCli){const role=event.target.dataset.roleCli;document.getElementById(`${role}-effort`).value='default';document.getElementById('capability-note').textContent='역할별 도구가 바뀌었어요. 해당 도구·모델의 생각 수준 지원을 따로 확인해 주세요.';}if(event.target.id==='cli-kind'){state.cli=event.target.value;state.capabilityChecked=false;document.getElementById('cli-path').value=state.cli;document.getElementById('codex-profile-field').hidden=state.cli!=='codex';document.getElementById('effort-help').textContent=(state.cli==='claude'?'Claude effort':'Codex reasoning effort')+' · 지원하는 값만 선택해요.';document.querySelectorAll('#scene-dialog select[id$="effort"]').forEach(select=>{select.value='default';Array.from(select.options).forEach(option=>option.disabled=option.value!=='default')});document.getElementById('capability-note').textContent='지원 미확인 · 도구가 바뀌었어요. 설치 버전과 지원하는 모델·생각 수준을 다시 확인해 주세요.';document.getElementById('model-suggestions').innerHTML='';}});
    window.addEventListener('hashchange',()=>{const scene=location.hash.slice(1);render(sceneNames[scene]?scene:'welcome')});
    render(sceneNames[location.hash.slice(1)]?location.hash.slice(1):'welcome');
  </script>
</body>
</html>
