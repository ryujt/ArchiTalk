[ai]
default_backend = "claude"
# Each model request has a fixed wall-time limit, including thinking/output.
# Allowed: 10..3600 seconds. Changes apply to the next new task.
# An active task and its schema repair keep the captured limit.
timeout_seconds = 1800

[ai.backends.claude]
executable = "claude"
# model = "your-installed-model-id"
# effort = "high"

[ai.backends.codex]
executable = "codex"
# model = "your-installed-model-id"
# effort = "high"
# Named profiles are disabled until merged permissions can be verified.

[ai.roles.conversation]
# backend = "claude"

[ai.roles.design]
# backend = "claude"

[ai.roles.critic]
# backend = "codex"
# effort = "high"

[documents]
directory = "docs/architecture"
language = "ko"
